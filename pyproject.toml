[project]
name = "pendulum-balancer-rl"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pygame-ce>=2.5.8",
    "seaborn>=0.13.2",
]

[project.scripts]
pendulum = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "engine", "orchestrator", "renderer", "replay", "rl", "scoring"]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "ty check"
check = ["lint", "typecheck"]
